version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahakaar_sathi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "" # Empty for local dev as per .env.example
      POSTGRES_DB: sahakaar_sathi
      POSTGRES_HOST_AUTH_METHOD: trust # Allow passwordless login for local dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sahakaar_sathi_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: sahakaar_sathi_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data:
