# Install this file as /etc/supervisor/conf.d/sahakaar-sathi.conf.
# Remove any stale template programs with the same names before running
# `supervisorctl reread`, `supervisorctl update`, and restarting both programs.

[program:backend]
command=npm start --workspace=apps/api
directory=/app
autostart=true
autorestart=true
environment=PORT="8001",NODE_ENV="production"
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:frontend]
command=npx --workspace=apps/kendra vite --host 0.0.0.0 --port 3000
directory=/app
autostart=true
autorestart=true
environment=HOST="0.0.0.0",PORT="3000"
stderr_logfile=/var/log/supervisor/frontend.err.log
stdout_logfile=/var/log/supervisor/frontend.out.log
stopsignal=TERM
stopwaitsecs=50
stopasgroup=true
killasgroup=true